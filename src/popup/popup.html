<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Account Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <span class="header-icon">🤖</span>
        <h1 class="header-title">X Account Filter</h1>
      </div>
      <label class="toggle-switch" title="フィルタリングを有効/無効">
        <input type="checkbox" id="toggle-enabled">
        <span class="toggle-slider"></span>
      </label>
    </header>

    <div class="content" id="main-content">

      <!-- 統計 -->
      <section class="stats-section">
        <div class="stat-card">
          <span class="stat-value" id="filtered-count">0</span>
          <span class="stat-label">今日フィルタリングした投稿</span>
        </div>
      </section>

      <!-- フィルター設定 -->
      <section class="section">
        <h2 class="section-title">フィルター設定</h2>

        <!-- Botスコア閾値 -->
        <div class="setting-row">
          <label class="setting-label" for="threshold-slider">
            Botスコア閾値
            <span class="setting-hint" id="threshold-value">50</span>
          </label>
          <input
            type="range"
            id="threshold-slider"
            min="10"
            max="90"
            step="5"
            value="50"
            class="slider"
          >
          <div class="slider-labels">
            <span>厳しめ（誤検出多）</span>
            <span>緩め（見逃し多）</span>
          </div>
        </div>

        <!-- 自動フィルタリング -->
        <div class="setting-row checkbox-row">
          <label class="checkbox-label" for="auto-filter">
            <input type="checkbox" id="auto-filter" checked>
            <span class="checkmark"></span>
            自動フィルタリング
          </label>
          <span class="setting-desc">スコアが閾値以上のアカウントを自動的にフィルタリング</span>
        </div>

        <!-- プレースホルダー表示 -->
        <div class="setting-row checkbox-row">
          <label class="checkbox-label" for="show-placeholder">
            <input type="checkbox" id="show-placeholder" checked>
            <span class="checkmark"></span>
            フィルタリング済みを折りたたみ表示
          </label>
          <span class="setting-desc">非表示にする代わりに「フィルタリング済み」と表示（クリックで展開可能）</span>
        </div>
      </section>

      <!-- 手動ブロックリスト -->
      <section class="section">
        <h2 class="section-title">手動ブロックリスト</h2>
        <div class="input-group">
          <input
            type="text"
            id="block-input"
            placeholder="@ユーザー名を入力"
            class="text-input"
            maxlength="50"
          >
          <button id="add-block-btn" class="btn btn-primary" type="button">追加</button>
        </div>
        <div id="block-list" class="block-list">
          <p class="empty-hint" id="block-list-empty">ブロックリストは空です</p>
        </div>
      </section>

      <!-- 説明 -->
      <section class="section info-section">
        <h2 class="section-title">検出項目</h2>
        <ul class="info-list">
          <li>🔤 ランダムなユーザー名パターン</li>
          <li>📊 フォロー/フォロワー比率の異常</li>
          <li>🕐 アカウント作成日の新しさ</li>
          <li>🔁 繰り返し投稿・類似コンテンツ</li>
          <li>#️⃣ ハッシュタグ・URLの過剰使用</li>
          <li>📉 エンゲージメント率の異常</li>
        </ul>
      </section>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
